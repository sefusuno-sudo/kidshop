<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} | KidsShop Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <style>
    .admin-sidebar { width: 240px; min-height: 100vh; background: #2d3748; }
    .admin-content { flex: 1; background: #f8f9fa; min-height: 100vh; }
    .sidebar-brand { padding: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar-link { display: flex; align-items: center; gap: 10px; padding: 10px 20px;
                    color: rgba(255,255,255,0.7); text-decoration: none; border-radius: 8px;
                    margin: 2px 10px; transition: all 0.2s; }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(255,255,255,0.1); color: #fff; }
    .sidebar-link i { font-size: 1.1rem; }
  </style>
</head>
<body>
<div class="d-flex">
  <!-- Sidebar -->
  <div class="admin-sidebar">
    <div class="sidebar-brand">
      <a href="{{ url_for('admin.dashboard') }}" class="text-white text-decoration-none fw-800 fs-5">
        🧸 KidsShop <span class="badge bg-warning text-dark ms-1 small">Admin</span>
      </a>
    </div>
    <nav class="py-3">
      <a href="{{ url_for('admin.dashboard') }}" class="sidebar-link {% if request.endpoint=='admin.dashboard' %}active{% endif %}">
        <i class="bi bi-speedometer2"></i> Dashboard
      </a>
      <a href="{{ url_for('admin.products') }}" class="sidebar-link {% if 'product' in request.endpoint %}active{% endif %}">
        <i class="bi bi-box-seam"></i> Produse
      </a>
      <a href="{{ url_for('admin.orders') }}" class="sidebar-link {% if 'order' in request.endpoint %}active{% endif %}">
        <i class="bi bi-receipt"></i> Comenzi
        {% set pending = namespace(count=0) %}
      </a>
      <a href="{{ url_for('admin.messages') }}" class="sidebar-link {% if request.endpoint=='admin.messages' %}active{% endif %}">
        <i class="bi bi-chat-dots"></i> Mesaje
      </a>
      <hr style="border-color:rgba(255,255,255,0.1); margin: 10px 20px">
      <a href="{{ url_for('main.index') }}" class="sidebar-link">
        <i class="bi bi-shop"></i> Vizitează magazinul
      </a>
      <a href="{{ url_for('auth.logout') }}" class="sidebar-link text-danger">
        <i class="bi bi-box-arrow-right"></i> Deconectare
      </a>
    </nav>
  </div>

  <!-- Content -->
  <div class="admin-content p-4">
    <!-- Flash messages -->
    {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ category }} alert-dismissible fade show rounded-3" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}

    {% block content %}{% endblock %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
